# CI: Lint / 型チェック / ユニットテスト / ビルド / E2E
# main への push と PR で実行する。Lighthouse は lighthouse.yml に分離。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Type / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # wrangler.jsonc から Cloudflare バインディング型を生成（ローカルでは手動、CI では毎回生成）
      - name: Generate Cloudflare types
        run: pnpm cf-typegen

      - name: Biome check (lint + format + import sort)
        run: pnpm biome check .

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run

      # NEXT_PUBLIC_* はビルド時にクライアントバンドルへインラインされるため、
      # CI ビルドと本番ビルドで同じ値を焼き込めるようここに列挙する。
      # lib/site.ts 側にも同値のデフォルトがあるので未指定でも動くが、
      # 本番 URL の「正」を 1 箇所に集約する意味で明示しておく。
      - name: Next.js build
        env:
          NEXT_PUBLIC_SITE_URL: https://frontend-dojo.rakurai.dev
          NEXT_PUBLIC_ZENN_URL: https://zenn.dev/rakurai
          NEXT_PUBLIC_X_URL: https://x.com/rakurai_tech
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # 重いのでユニットテストとは分離し、main / PR どちらでも実行する
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare types
        run: pnpm cf-typegen

      # playwright.config.ts の webServer は CI で `pnpm start` を呼ぶため、事前にビルドしておく
      # NEXT_PUBLIC_* はビルド時にクライアントバンドルへインラインされるため、
      # CI ビルドと本番ビルドで同じ値を焼き込めるようここに列挙する。
      # lib/site.ts 側にも同値のデフォルトがあるので未指定でも動くが、
      # 本番 URL の「正」を 1 箇所に集約する意味で明示しておく。
      - name: Next.js build
        env:
          NEXT_PUBLIC_SITE_URL: https://frontend-dojo.rakurai.dev
          NEXT_PUBLIC_ZENN_URL: https://zenn.dev/rakurai
          NEXT_PUBLIC_X_URL: https://x.com/rakurai_tech
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # CI では chromium / mobile-chrome のみ、かつ tests/e2e だけを対象にする。
      # firefox/webkit はローカル検証用、Visual Regression は baseline 運用が必要なのでローカル専用。
      - name: Run E2E
        run: pnpm exec playwright test tests/e2e --project=chromium --project=mobile-chrome

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
